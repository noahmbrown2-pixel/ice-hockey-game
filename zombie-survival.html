<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Zombie Survival — Twin-Stick</title>
<style>
  html,body{margin:0;height:100%;background:#0a0a0a;overflow:hidden;font-family:'Courier New',monospace;color:#00ff41}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{background:#141414;display:block;max-width:100%;max-height:100%;touch-action:none}
  #hud{position:fixed;top:8px;left:8px;font-size:14px;text-shadow:0 0 4px #000;pointer-events:none;line-height:1.5}
  #hud b{color:#fff}
  #msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
       text-align:center;background:rgba(5,5,5,.86);z-index:5}
  #msg h1{font-size:34px;margin:.2em;color:#ff3b3b;text-shadow:0 0 10px #ff0000}
  #msg p{max-width:520px;font-size:15px;line-height:1.6;color:#9fffb0}
  #msg button{margin-top:14px;background:#00ff41;color:#000;border:0;padding:12px 26px;font-size:16px;
       font-family:inherit;font-weight:bold;border-radius:6px;cursor:pointer}
  .hide{display:none!important}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="960" height="600"></canvas></div>
<div id="hud"></div>
<div id="msg">
  <h1>ZOMBIE SURVIVAL</h1>
  <p><b style="color:#fff">Top-down twin-stick shooter.</b><br>
     Move: <b style="color:#fff">WASD / Arrows</b> &nbsp; Aim+Shoot: <b style="color:#fff">Mouse</b> (hold to fire)<br>
     Reload: <b style="color:#fff">R</b> &nbsp; Dash: <b style="color:#fff">Shift</b> &nbsp; Pause: <b style="color:#fff">P</b><br>
     Survive endless waves. Kill zombies, grab the <span style="color:#ffd24a">cash</span> they drop,
     and buy upgrades between waves. They get faster and meaner every wave.</p>
  <button id="start">START</button>
</div>
<script>
const C=document.getElementById('c'), X=C.getContext('2d');
const W=C.width, H=C.height;
const hud=document.getElementById('hud'), msg=document.getElementById('msg');
const rand=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);

let keys={}, mouse={x:W/2,y:H/2,down:false};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true; if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault();});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function mpos(e){const r=C.getBoundingClientRect();mouse.x=(e.clientX-r.left)*(W/r.width);mouse.y=(e.clientY-r.top)*(H/r.height);}
C.addEventListener('mousemove',mpos);
C.addEventListener('mousedown',e=>{mpos(e);mouse.down=true;});
addEventListener('mouseup',()=>mouse.down=false);
C.addEventListener('touchstart',e=>{const t=e.touches[0];mpos(t);mouse.down=true;e.preventDefault();},{passive:false});
C.addEventListener('touchmove',e=>{mpos(e.touches[0]);e.preventDefault();},{passive:false});
C.addEventListener('touchend',()=>mouse.down=false);

let P, zombies, bullets, drops, particles, wave, betweenWaves, spawnQueue, spawnT, cash, score, paused, dead, started=false, shake=0;

function reset(){
  P={x:W/2,y:H/2,r:13,spd:3.0,hp:100,maxhp:100,
     dmg:18,fireRate:9,reload:90,clip:12,maxClip:12,ammo:12,reloadT:0,fireT:0,
     dashT:0,dashCd:0,pierce:0,multishot:1,spread:0.06};
  zombies=[];bullets=[];drops=[];particles=[];
  wave=0;cash=0;score=0;paused=false;dead=false;betweenWaves=true;
  spawnQueue=0;spawnT=0;shake=0;
  startWave();
}
function startWave(){
  wave++; betweenWaves=false;
  spawnQueue = 6 + wave*3;
  spawnT=0;
  P.ammo=P.maxClip; P.reloadT=0;
}
function spawnZombie(){
  // spawn off-screen edge
  let side=Math.floor(rand(0,4)), x,y;
  if(side===0){x=rand(0,W);y=-30;} else if(side===1){x=W+30;y=rand(0,H);}
  else if(side===2){x=rand(0,W);y=H+30;} else {x=-30;y=rand(0,H);}
  let t='walker';
  const roll=Math.random();
  if(wave>=3 && roll<0.12+wave*0.01) t='runner';
  if(wave>=5 && roll>0.92) t='brute';
  const base={
    walker:{hp:24,spd:0.85,r:12,dmg:8,col:'#6a9e4f',cash:3},
    runner:{hp:16,spd:1.9,r:10,dmg:6,col:'#c7d24a',cash:5},
    brute:{hp:120,spd:0.6,r:20,dmg:22,col:'#9e4f4f',cash:14},
  }[t];
  const hpMul=1+wave*0.14, spMul=1+wave*0.03;
  zombies.push({x,y,t,r:base.r,hp:base.hp*hpMul,maxhp:base.hp*hpMul,
    spd:base.spd*spMul,dmg:base.dmg,col:base.col,cash:base.cash,hit:0,wob:rand(0,6.28)});
}
function fire(){
  if(P.reloadT>0||P.fireT>0) return;
  if(P.ammo<=0){P.reloadT=P.reload;return;}
  P.ammo--; P.fireT=P.fireRate;
  const ang=Math.atan2(mouse.y-P.y,mouse.x-P.x);
  for(let i=0;i<P.multishot;i++){
    const off=(i-(P.multishot-1)/2)*0.12;
    const a=ang+off+rand(-P.spread,P.spread);
    bullets.push({x:P.x+Math.cos(a)*16,y:P.y+Math.sin(a)*16,
      vx:Math.cos(a)*12,vy:Math.sin(a)*12,life:55,pierce:P.pierce,dmg:P.dmg});
  }
  // muzzle
  for(let i=0;i<4;i++)particles.push({x:P.x+Math.cos(ang)*18,y:P.y+Math.sin(ang)*18,
    vx:Math.cos(ang)*rand(1,4)+rand(-1,1),vy:Math.sin(ang)*rand(1,4)+rand(-1,1),life:rand(6,14),col:'#ffd24a',r:2});
  shake=Math.min(shake+1.5,6);
}
function burst(x,y,col,n){for(let i=0;i<n;i++){const a=rand(0,6.28),s=rand(1,5);
  particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(12,28),col,r:rand(1.5,3.5)});}}

function update(){
  if(paused||dead) return;
  // between-wave handled in shop overlay; here only active combat + spawning
  if(!betweenWaves){
    // spawn
    if(spawnQueue>0){spawnT--; if(spawnT<=0){spawnZombie();spawnQueue--;spawnT=Math.max(8,40-wave*1.5);}}
    if(spawnQueue<=0 && zombies.length===0){ openShop(); }
  }
  // player move
  let mx=(keys['d']||keys['arrowright']?1:0)-(keys['a']||keys['arrowleft']?1:0);
  let my=(keys['s']||keys['arrowdown']?1:0)-(keys['w']||keys['arrowup']?1:0);
  const ml=Math.hypot(mx,my)||1; mx/=ml;my/=ml;
  let sp=P.spd;
  if(P.dashT>0){sp=8.5;P.dashT--;}
  P.x=clamp(P.x+mx*sp,P.r,W-P.r); P.y=clamp(P.y+my*sp,P.r,H-P.r);
  if(P.dashCd>0)P.dashCd--;
  if(keys['shift']&&P.dashCd<=0&&(mx||my)){P.dashT=8;P.dashCd=45;burst(P.x,P.y,'#00ff41',8);}
  // shooting
  if(P.fireT>0)P.fireT--;
  if(P.reloadT>0){P.reloadT--; if(P.reloadT<=0)P.ammo=P.maxClip;}
  if(keys['r']&&P.ammo<P.maxClip&&P.reloadT<=0)P.reloadT=P.reload;
  if(mouse.down)fire();
  // bullets
  for(const b of bullets){b.x+=b.vx;b.y+=b.vy;b.life--;
    for(const z of zombies){ if(z.dead)continue;
      if(dist(b.x,b.y,z.x,z.y)<z.r+3){ z.hp-=b.dmg; z.hit=6; burst(b.x,b.y,'#ff5a5a',4);
        if(b.pierce>0){b.pierce--;} else {b.life=0;}
        if(z.hp<=0){z.dead=true; score+=Math.round(z.maxhp); burst(z.x,z.y,z.col,14);
          for(let k=0;k<Math.ceil(z.cash/3);k++)drops.push({x:z.x+rand(-8,8),y:z.y+rand(-8,8),v:3,col:'#ffd24a',t:0});}
        if(b.life<=0)break;
      }
    }
  }
  bullets=bullets.filter(b=>b.life>0&&b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20);
  zombies=zombies.filter(z=>!z.dead);
  // zombies move + attack
  for(const z of zombies){
    z.wob+=0.2;
    const a=Math.atan2(P.y-z.y,P.x-z.x);
    const wobOff=Math.sin(z.wob)*0.25;
    z.x+=Math.cos(a+wobOff)*z.spd; z.y+=Math.sin(a+wobOff)*z.spd;
    if(z.hit>0)z.hit--;
    // separation (avoid clumping into one dot)
    for(const o of zombies){ if(o===z)continue; const d=dist(z.x,z.y,o.x,o.y);
      if(d>0&&d<z.r+o.r){const push=(z.r+o.r-d)/2; const pa=Math.atan2(z.y-o.y,z.x-o.x);
        z.x+=Math.cos(pa)*push*0.5; z.y+=Math.sin(pa)*push*0.5;}}
    if(dist(z.x,z.y,P.x,P.y)<z.r+P.r){
      if(P.dashT<=0){P.hp-=z.dmg*0.08; shake=Math.min(shake+0.5,5);
        if(P.hp<=0){P.hp=0;dead=true;gameOver();}}
    }
  }
  // drops magnet + pickup
  for(const d of drops){
    if(dist(d.x,d.y,P.x,P.y)<90){const a=Math.atan2(P.y-d.y,P.x-d.x);d.x+=Math.cos(a)*5;d.y+=Math.sin(a)*5;}
    if(dist(d.x,d.y,P.x,P.y)<P.r+6){d.got=true;cash+=3;score+=3;}
  }
  drops=drops.filter(d=>!d.got);
  // particles
  for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vx*=0.92;p.vy*=0.92;p.life--;}
  particles=particles.filter(p=>p.life>0);
  if(shake>0)shake*=0.85;
}

function draw(){
  X.save();
  if(shake>0.3)X.translate(rand(-shake,shake),rand(-shake,shake));
  // floor grid
  X.fillStyle='#141414';X.fillRect(0,0,W,H);
  X.strokeStyle='#1f1f1f';X.lineWidth=1;
  for(let x=0;x<W;x+=40){X.beginPath();X.moveTo(x,0);X.lineTo(x,H);X.stroke();}
  for(let y=0;y<H;y+=40){X.beginPath();X.moveTo(0,y);X.lineTo(W,y);X.stroke();}
  // drops
  for(const d of drops){X.fillStyle=d.col;X.fillRect(d.x-3,d.y-3,6,6);X.fillStyle='#7a5a00';X.fillRect(d.x-1,d.y-1,2,2);}
  // zombies
  for(const z of zombies){
    X.fillStyle=z.hit>0?'#fff':z.col;
    X.beginPath();X.arc(z.x,z.y,z.r,0,6.28);X.fill();
    X.fillStyle='#0a0a0a'; // eyes
    X.fillRect(z.x-z.r*0.4,z.y-z.r*0.2,3,3);X.fillRect(z.x+z.r*0.2,z.y-z.r*0.2,3,3);
    if(z.hp<z.maxhp){X.fillStyle='#000';X.fillRect(z.x-z.r,z.y-z.r-7,z.r*2,4);
      X.fillStyle='#ff3b3b';X.fillRect(z.x-z.r,z.y-z.r-7,z.r*2*(z.hp/z.maxhp),4);}
  }
  // bullets
  X.fillStyle='#ffd24a';for(const b of bullets){X.fillRect(b.x-2,b.y-2,4,4);}
  // player
  const ang=Math.atan2(mouse.y-P.y,mouse.x-P.x);
  X.save();X.translate(P.x,P.y);X.rotate(ang);
  X.fillStyle=P.dashT>0?'#aaffcc':'#00ff41';
  X.beginPath();X.arc(0,0,P.r,0,6.28);X.fill();
  X.fillStyle='#0a3a18';X.fillRect(2,-3,P.r+6,6); // gun
  X.restore();
  // particles
  for(const p of particles){X.globalAlpha=clamp(p.life/24,0,1);X.fillStyle=p.col;X.fillRect(p.x-p.r,p.y-p.r,p.r*2,p.r*2);}
  X.globalAlpha=1;
  // aim reticle
  X.strokeStyle='rgba(255,90,90,.7)';X.lineWidth=2;X.beginPath();X.arc(mouse.x,mouse.y,8,0,6.28);X.stroke();
  X.restore();
}

function drawHUD(){
  const hpPct=Math.round(P.hp);
  hud.innerHTML=
   `WAVE <b>${wave}</b> &nbsp; SCORE <b>${score}</b> &nbsp; CASH <b style="color:#ffd24a">$${cash}</b><br>`+
   `HP <b style="color:${P.hp<30?'#ff3b3b':'#00ff41'}">${hpPct}</b>/${P.maxhp} &nbsp; `+
   `AMMO <b>${P.reloadT>0?'RELOADING…':P.ammo+'/'+P.maxClip}</b> &nbsp; `+
   `LEFT <b>${zombies.length+spawnQueue}</b>`;
}

// ---- Shop between waves ----
const upgrades=[
 {n:'Damage +30%',c:40,f:()=>P.dmg=Math.round(P.dmg*1.3)},
 {n:'Fire Rate +',c:45,f:()=>P.fireRate=Math.max(3,P.fireRate-1.5)},
 {n:'Bigger Clip +6',c:35,f:()=>{P.maxClip+=6;P.ammo=P.maxClip;}},
 {n:'Max HP +30 & heal',c:40,f:()=>{P.maxhp+=30;P.hp=P.maxhp;}},
 {n:'Move Speed +',c:35,f:()=>P.spd+=0.45},
 {n:'+1 Shot (multishot)',c:80,f:()=>P.multishot++},
 {n:'Piercing +1',c:70,f:()=>P.pierce++},
 {n:'Fast Reload',c:30,f:()=>P.reload=Math.max(25,P.reload-18)},
];
function openShop(){
  betweenWaves=true; paused=true;
  // heal a little each wave
  P.hp=Math.min(P.maxhp,P.hp+15);
  const picks=[];const pool=[...upgrades];
  for(let i=0;i<3&&pool.length;i++){picks.push(pool.splice(Math.floor(rand(0,pool.length)),1)[0]);}
  msg.classList.remove('hide');
  msg.innerHTML=`<h1 style="color:#00ff41;text-shadow:0 0 10px #00ff41">WAVE ${wave} CLEARED</h1>
    <p>Cash: <b style="color:#ffd24a">$${cash}</b> &nbsp; Score: <b style="color:#fff">${score}</b><br>Buy an upgrade (or skip):</p>
    <div id="shop" style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:640px"></div>`;
  const sh=document.getElementById('shop');
  picks.forEach(u=>{
    const b=document.createElement('button');
    b.textContent=`${u.n} — $${u.c}`;
    b.style.cssText='background:#00ff41;color:#000;border:0;padding:10px 16px;font:inherit;font-weight:bold;border-radius:6px;cursor:pointer';
    if(cash<u.c){b.style.opacity=.4;b.disabled=true;}
    b.onclick=()=>{cash-=u.c;u.f();closeShop();};
    sh.appendChild(b);
  });
  const skip=document.createElement('button');
  skip.textContent='SKIP ▶ NEXT WAVE';
  skip.style.cssText='background:#333;color:#fff;border:1px solid #00ff41;padding:10px 16px;font:inherit;border-radius:6px;cursor:pointer';
  skip.onclick=closeShop; sh.appendChild(skip);
}
function closeShop(){msg.classList.add('hide');paused=false;startWave();}

function gameOver(){
  msg.classList.remove('hide');
  msg.innerHTML=`<h1>YOU DIED</h1>
    <p>You survived <b style="color:#fff">${wave}</b> waves.<br>
       Final score: <b style="color:#ffd24a">${score}</b></p>
    <button id="again">PLAY AGAIN</button>`;
  document.getElementById('again').onclick=()=>{msg.classList.add('hide');reset();};
}

addEventListener('keydown',e=>{if(e.key.toLowerCase()==='p'&&started&&!dead&&!betweenWaves)paused=!paused;});

function loop(){if(started){update();draw();drawHUD();}requestAnimationFrame(loop);}
document.getElementById('start').onclick=()=>{started=true;msg.classList.add('hide');reset();};
loop();
</script>
</body>
</html>
