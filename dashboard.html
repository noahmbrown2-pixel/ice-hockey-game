<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Code Dashboard</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg: #0a0a0f;
    --panel: #14141c;
    --panel-2: #1c1c28;
    --border: #2a2a3a;
    --text: #e8e8f0;
    --muted: #8888a0;
    --accent: #7c5cff;
    --accent-2: #4dd6ff;
    --green: #4ade80;
    --orange: #fb923c;
    --red: #f87171;
    --yellow: #facc15;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, 'SF Pro Display', 'Segoe UI', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:-1;
    background:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(124,92,255,0.25), transparent),
      radial-gradient(ellipse 60% 50% at 100% 100%, rgba(77,214,255,0.12), transparent);
  }

  /* Header */
  header {
    padding: 32px 40px 24px;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
    background: rgba(10,10,15,0.85);
    backdrop-filter: blur(20px);
  }
  .header-row { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:20px; }
  h1 {
    font-size: 28px; font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.5px;
  }
  .header-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }

  /* Stats */
  .stats { display:flex; gap:16px; }
  .stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 18px;
    min-width: 100px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .stat:hover { border-color: var(--accent); transform: translateY(-2px); }
  .stat.active { border-color: var(--accent); background: linear-gradient(135deg, rgba(124,92,255,0.15), rgba(77,214,255,0.05)); }
  .stat-num { font-size: 24px; font-weight: 700; line-height: 1; }
  .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }

  /* Search bar */
  .toolbar {
    padding: 20px 40px;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  .search {
    flex: 1; min-width: 300px;
    position: relative;
  }
  .search input {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px 12px 40px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }
  .search input:focus { border-color: var(--accent); }
  .search::before {
    content: '🔍';
    position: absolute;
    left: 14px; top: 50%;
    transform: translateY(-50%);
    opacity: 0.5;
    pointer-events: none;
  }
  .filter-chips { display:flex; gap:8px; flex-wrap:wrap; }
  .chip {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 6px 14px;
    font-size: 12px;
    cursor: pointer;
    color: var(--muted);
    transition: all 0.15s;
    white-space: nowrap;
  }
  .chip:hover { color: var(--text); border-color: var(--accent); }
  .chip.active { color: white; background: var(--accent); border-color: var(--accent); }

  /* Tabs */
  .tabs {
    padding: 0 40px;
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
  }
  .tab {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 14px;
    font-weight: 500;
    padding: 14px 20px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    font-family: inherit;
    transition: all 0.15s;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .tab-count {
    margin-left: 6px;
    background: var(--panel);
    padding: 1px 8px;
    border-radius: 10px;
    font-size: 11px;
    color: var(--muted);
  }
  .tab.active .tab-count { color: var(--accent); background: rgba(124,92,255,0.15); }

  /* Grid */
  main { padding: 24px 40px 60px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    transition: all 0.2s;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(124,92,255,0.15);
  }
  .card-header { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom: 6px; }
  .card-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    word-break: break-word;
  }
  .card-prefix {
    color: var(--accent);
    font-weight: 700;
  }
  .card-badge {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .badge-command { background: rgba(124,92,255,0.15); color: var(--accent); }
  .badge-skill { background: rgba(77,214,255,0.15); color: var(--accent-2); }
  .badge-hook { background: rgba(251,146,60,0.15); color: var(--orange); }
  .badge-pre { background: rgba(74,222,128,0.15); color: var(--green); }
  .badge-post { background: rgba(248,113,113,0.15); color: var(--red); }
  .badge-config { background: rgba(250,204,21,0.15); color: var(--yellow); }
  .card-desc {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-tag {
    display: inline-block;
    font-size: 10px;
    color: var(--muted);
    background: var(--panel-2);
    padding: 2px 8px;
    border-radius: 6px;
    margin-top: 8px;
    margin-right: 4px;
  }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }

  /* Modal */
  .modal-bg {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    max-width: 640px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    padding: 28px;
  }
  .modal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom: 16px; }
  .modal-title { font-size: 20px; font-weight: 700; word-break: break-word; }
  .modal-close {
    background: none; border: none; color: var(--muted);
    font-size: 24px; cursor: pointer; padding: 0 8px;
  }
  .modal-close:hover { color: var(--text); }
  .modal-body { color: var(--muted); font-size: 14px; line-height: 1.6; }
  .modal-meta {
    display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap;
  }
  .modal-meta-item {
    background: var(--panel-2);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
  }
  .modal-meta-key { color: var(--muted); margin-right: 4px; }
  .modal-meta-val { color: var(--text); font-family: monospace; }

  @media (max-width: 720px) {
    header, .toolbar, .tabs, main { padding-left: 20px; padding-right: 20px; }
    .stats { width: 100%; overflow-x: auto; }
    h1 { font-size: 22px; }
  }
</style>
</head>

function categorize(name) {
  if (name.startsWith('run-workflow-')) return 'workflow';
  if (name.startsWith('spawn-')) return 'team-spawn';
  if (name.startsWith('crypto')) return 'crypto';
  if (name.startsWith('debate') || name.includes('deliberate')) return 'debate';
  if (name.startsWith('context_prime') || name.startsWith('prime')) return 'priming';
  if (name.startsWith('list-')) return 'introspection';
  if (name.includes('agent')) return 'agent-ops';
  if (name.includes('csv') || name.includes('finance')) return 'finance/data';
  if (name.startsWith('plan')) return 'planning';
  if (name.startsWith('run-') || name.includes('execute')) return 'execution';
  if (name.includes('tb-') || name === 'thebaby-start') return 'thebaby';
  return 'other';
}

// ── Render ──
const grid = document.getElementById('grid');
const empty = document.getElementById('empty');
const searchInput = document.getElementById('searchInput');
const chipBar = document.getElementById('chipBar');

let activeTab = 'all';
let activeChip = null;
let query = '';

function getFiltered() {
  return ITEMS.filter(it => {
    if (activeTab !== 'all' && it.type !== activeTab.replace(/s$/, '')) {
      if (!(activeTab === 'commands' && it.type === 'command')) {
        if (!(activeTab === 'skills' && it.type === 'skill')) {
          if (!(activeTab === 'hooks' && it.type === 'hook')) return false;
        }
      }
    }
    if (activeChip && it.category !== activeChip) return false;
    if (query) {
      const q = query.toLowerCase();
      if (!it.name.toLowerCase().includes(q) && !it.desc.toLowerCase().includes(q) && !it.category.toLowerCase().includes(q)) return false;
    }
    return true;
  });
}

function render() {
  const filtered = getFiltered();
  grid.innerHTML = '';
  if (filtered.length === 0) {
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  const frag = document.createDocumentFragment();
  filtered.forEach(it => frag.appendChild(makeCard(it)));
  grid.appendChild(frag);
  renderChips();
}

function makeCard(it) {
  const card = document.createElement('div');
  card.className = 'card';
  const prefix = it.type === 'command' ? '/' : '';
  const badgeCls =
    it.type === 'command' ? 'badge-command' :
    it.type === 'skill' ? 'badge-skill' :
    (it.category && it.category.startsWith('Pre')) ? 'badge-pre' :
    (it.category && it.category.startsWith('Post')) ? 'badge-post' :
    'badge-hook';

  const title = document.createElement('div');
  title.className = 'card-title';
  if (prefix) {
    const p = document.createElement('span'); p.className = 'card-prefix'; p.textContent = prefix;
    title.appendChild(p);
  }
  title.appendChild(document.createTextNode(it.name));

  const badge = document.createElement('span');
  badge.className = 'card-badge ' + badgeCls;
  badge.textContent = it.type === 'hook' ? (it.category || 'hook') : it.type;

  const header = document.createElement('div');
  header.className = 'card-header';
  header.appendChild(title);
  header.appendChild(badge);

  const desc = document.createElement('div');
  desc.className = 'card-desc';
  desc.textContent = it.desc;

  card.appendChild(header);
  card.appendChild(desc);
  if (it.type !== 'hook') {
    const tag = document.createElement('span');
    tag.className = 'card-tag';
    tag.textContent = it.category;
    card.appendChild(tag);
  }
  card.addEventListener('click', () => openModal(it));
  return card;
}

function renderChips() {
  const items = ITEMS.filter(it => {
    if (activeTab === 'all') return true;
    return (activeTab === 'commands' && it.type === 'command') ||
           (activeTab === 'skills' && it.type === 'skill') ||
           (activeTab === 'hooks' && it.type === 'hook');
  });
  const cats = {};
  items.forEach(it => cats[it.category] = (cats[it.category] || 0) + 1);
  const sorted = Object.entries(cats).sort((a,b) => b[1] - a[1]);
  chipBar.innerHTML = '';
  const allChip = document.createElement('div');
  allChip.className = 'chip' + (activeChip === null ? ' active' : '');
  allChip.textContent = `all (${items.length})`;
  allChip.addEventListener('click', () => { activeChip = null; render(); });
  chipBar.appendChild(allChip);
  sorted.forEach(([cat, count]) => {
    const c = document.createElement('div');
    c.className = 'chip' + (activeChip === cat ? ' active' : '');
    c.textContent = `${cat} (${count})`;
    c.addEventListener('click', () => { activeChip = activeChip === cat ? null : cat; render(); });
    chipBar.appendChild(c);
  });
}

// Tab + stat clicks
function setTab(tab) {
  activeTab = tab;
  activeChip = null;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.querySelectorAll('.stat').forEach(s => s.classList.toggle('active', s.dataset.tab === tab));
  render();
}
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => setTab(t.dataset.tab)));
document.querySelectorAll('.stat').forEach(s => s.addEventListener('click', () => setTab(s.dataset.tab)));

// Search
searchInput.addEventListener('input', e => { query = e.target.value; render(); });

// Modal
const modalBg = document.getElementById('modalBg');
const modalTitle = document.getElementById('modalTitle');
const modalBody = document.getElementById('modalBody');
const modalMeta = document.getElementById('modalMeta');
document.getElementById('modalClose').addEventListener('click', () => modalBg.classList.remove('open'));
modalBg.addEventListener('click', e => { if (e.target === modalBg) modalBg.classList.remove('open'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') modalBg.classList.remove('open'); });

function openModal(it) {
  const prefix = it.type === 'command' ? '/' : '';
  modalTitle.textContent = prefix + it.name;
  modalBody.textContent = it.desc;
  modalMeta.innerHTML = '';
  const fields = [
    ['Type', it.type],
    ['Category', it.category || '—'],
  ];
  if (it.type === 'command') fields.push(['Invoke', `/${it.name}`]);
  if (it.type === 'skill') fields.push(['Path', `.claude/skills/${it.name}/SKILL.md`]);
  if (it.type === 'hook') fields.push(['Path', `.claude/hooks/${it.name}`]);
  fields.forEach(([k,v]) => {
    const el = document.createElement('div'); el.className = 'modal-meta-item';
    const ke = document.createElement('span'); ke.className = 'modal-meta-key'; ke.textContent = k + ':';
    const ve = document.createElement('span'); ve.className = 'modal-meta-val'; ve.textContent = v;
    el.appendChild(ke); el.appendChild(ve);
    modalMeta.appendChild(el);
  });
  modalBg.classList.add('open');
}

// Initial counts
const totalCmds = COMMANDS.length;
const totalSkills = SKILLS.length;
const totalHooks = HOOKS.length;
const total = totalCmds + totalSkills + totalHooks;
document.getElementById('statAll').textContent = total;
document.getElementById('statCmds').textContent = totalCmds;
document.getElementById('statSkills').textContent = totalSkills;
document.getElementById('statHooks').textContent = totalHooks;
document.getElementById('cntAll').textContent = total;
document.getElementById('cntCmds').textContent = totalCmds;
document.getElementById('cntSkills').textContent = totalSkills;
document.getElementById('cntHooks').textContent = totalHooks;
document.getElementById('headerSub').textContent = `${total} items across ${totalCmds} commands · ${totalSkills} skills · ${totalHooks} hooks`;
document.querySelector('.stat[data-tab="all"]').classList.add('active');

render();
</script>
</body>
</html>
