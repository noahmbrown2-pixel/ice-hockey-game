# 2026-05-17: Prevent SIGTERM cgroup-kill from killing in-flight `claude --print`
# subprocesses mid-execution, which was marking ACTION commands as Exit 143
# instead of letting them complete cleanly. KillMode=mixed sends TERM only to
# the daemon's main pid; the daemon's existing signal handler at
# tb_command_daemon.py:696 then sets self.running=False so the processing loop
# exits between commands, allowing the in-flight subprocess to complete.
# TimeoutStopSec=900 matches the action handler's 15-min claude --print timeout.
[Service]
KillMode=mixed
TimeoutStopSec=900
