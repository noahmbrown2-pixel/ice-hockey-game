  // — Drawing —
  function drawTable(){
    const rg=ctx.createLinearGradient(0,0,0,H);
    rg.addColorStop(0,'#6b3d12');rg.addColorStop(0.5,'#4a2808');rg.addColorStop(1,'#6b3d12');
    ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#3a2008';ctx.fillRect(3,3,W-6,H-6);
    ctx.fillStyle='#7a4820';ctx.fillRect(6,6,W-12,H-12);
    ctx.fillStyle='#1a6b35';ctx.fillRect(RAIL,RAIL,W-RAIL*2,H-RAIL*2);
    ctx.strokeStyle='rgba(15,80,30,0.22)';ctx.lineWidth=0.5;
    for(let y=RAIL;y<=H-RAIL;y+=6){ctx.beginPath();ctx.moveTo(RAIL,y);ctx.lineTo(W-RAIL,y);ctx.stroke();}
    ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.lineWidth=1;ctx.setLineDash([4,5]);
    ctx.beginPath();ctx.moveTo(W*0.27,RAIL+4);ctx.lineTo(W*0.27,H-RAIL-4);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='rgba(212,168,67,0.65)';
    [[W/4,RAIL/2],[W/2,RAIL/2],[W*3/4,RAIL/2],[W/4,H-RAIL/2],[W/2,H-RAIL/2],[W*3/4,H-RAIL/2],[RAIL/2,H/2],[W-RAIL/2,H/2]].forEach(([dx,dy])=>{
      ctx.save();ctx.translate(dx,dy);ctx.rotate(Math.PI/4);ctx.fillRect(-3,-3,6,6);ctx.restore();
    });
    pockets.forEach(p=>{
      ctx.beginPath();ctx.arc(p.x,p.y,PCK_R+4,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fill();
      ctx.beginPath();ctx.arc(p.x,p.y,PCK_R,0,Math.PI*2);ctx.fillStyle='#060606';ctx.fill();
      ctx.beginPath();ctx.arc(p.x,p.y,PCK_R+1,0,Math.PI*2);ctx.strokeStyle='#9B6F1A';ctx.lineWidth=2.5;ctx.stroke();
    });
  }

  function drawBall(b){
    if(b.sunk)return;
    const stripe=b.num>=9,col=BCOLOR[b.num];
    ctx.save();
    ctx.beginPath();ctx.arc(b.x+1.5,b.y+2,BR,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,0.25)';ctx.fill();
    ctx.beginPath();ctx.arc(b.x,b.y,BR,0,Math.PI*2);
    if(b.num===0){const g2=ctx.createRadialGradient(b.x-3,b.y-3,1,b.x,b.y,BR);g2.addColorStop(0,'#fff');g2.addColorStop(1,'#ccc');ctx.fillStyle=g2;}
    else if(stripe){ctx.fillStyle='#f5f5f0';}
    else{const g2=ctx.createRadialGradient(b.x-3,b.y-3,1,b.x+2,b.y+2,BR);g2.addColorStop(0,lighten(col,50));g2.addColorStop(1,col);ctx.fillStyle=g2;}
    ctx.fill();ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=0.7;ctx.stroke();
    if(stripe){
      ctx.save();ctx.beginPath();ctx.arc(b.x,b.y,BR,0,Math.PI*2);ctx.clip();
      const sg=ctx.createRadialGradient(b.x-3,b.y,1,b.x,b.y,BR);sg.addColorStop(0,lighten(col,40));sg.addColorStop(1,col);
      ctx.fillStyle=sg;ctx.fillRect(b.x-BR,b.y-BR*0.44,BR*2,BR*0.88);ctx.restore();
      ctx.beginPath();ctx.arc(b.x,b.y,BR,0,Math.PI*2);ctx.strokeStyle='rgba(0,0,0,0.15)';ctx.lineWidth=0.5;ctx.stroke();
    }
    if(b.num>0){
      ctx.beginPath();ctx.arc(b.x,b.y,BR*0.44,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,0.92)';ctx.fill();
      ctx.fillStyle='#111';ctx.font=`bold ${Math.floor(BR*0.64)}px sans-serif`;
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b.num,b.x,b.y+0.5);
    }
    ctx.beginPath();ctx.arc(b.x-BR*0.32,b.y-BR*0.32,BR*0.2,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,0.52)';ctx.fill();
    ctx.restore();
  }

  function drawSinkingBalls(){
    sinkingBalls=sinkingBalls.filter(s=>{
      s.alpha-=0.055;s.scale-=0.07;
      if(s.alpha<=0||s.scale<=0)return false;
      ctx.save();ctx.globalAlpha=Math.max(0,s.alpha);
      ctx.beginPath();ctx.arc(s.x,s.y,BR*Math.max(0,s.scale),0,Math.PI*2);
      ctx.fillStyle=BCOLOR[s.num];ctx.fill();ctx.restore();
      return true;
    });
  }

  // — Trajectory —
  function calcTraj(dx,dy){
    const segs=[],MAX_B=3;
    let rx=cueBall.x,ry=cueBall.y,d1=dx,d2=dy,hitResult=null;
    for(let b=0;b<=MAX_B;b++){
      let minT=1600,hT=null,hBall=null,wNx=0,wNy=0;
      balls.forEach(ball=>{
        if(ball.sunk||ball===cueBall)return;
        const lx=ball.x-rx,ly=ball.y-ry,t=lx*d1+ly*d2;
        if(t<=0)return;
        const px=lx-t*d1,py=ly-t*d2,R=BR*2,d2_=px*px+py*py;
        if(d2_>=R*R)return;
        const tH=t-Math.sqrt(R*R-d2_);
        if(tH>1&&tH<minT){minT=tH;hT='ball';hBall=ball;}
      });
      if(d1<-0.001){const t=(RAIL+BR-rx)/d1;if(t>0&&t<minT){minT=t;hT='wall';wNx=-1;wNy=0;}}
      if(d1>0.001){const t=(W-RAIL-BR-rx)/d1;if(t>0&&t<minT){minT=t;hT='wall';wNx=1;wNy=0;}}
      if(d2<-0.001){const t=(RAIL+BR-ry)/d2;if(t>0&&t<minT){minT=t;hT='wall';wNx=0;wNy=-1;}}
      if(d2>0.001){const t=(H-RAIL-BR-ry)/d2;if(t>0&&t<minT){minT=t;hT='wall';wNx=0;wNy=1;}}
      const ex=rx+d1*minT,ey=ry+d2*minT;
      segs.push({x1:rx,y1:ry,x2:ex,y2:ey});
      if(hT==='ball'){
        const cnx=hBall.x-ex,cny=hBall.y-ey,cl=Math.hypot(cnx,cny);
        if(cl>0){
          const nx2=cnx/cl,ny2=cny/cl,dot=d1*nx2+d2*ny2;
          const cdx=d1-dot*nx2,cdy=d2-dot*ny2,cl2=Math.hypot(cdx,cdy);
          hitResult={ball:hBall,gx:ex,gy:ey,tDx:nx2,tDy:ny2,cDx:cl2>0.01?cdx/cl2:0,cDy:cl2>0.01?cdy/cl2:0};
        }
        break;
      }
      if(hT==='wall'){rx=ex;ry=ey;if(Math.abs(wNx)>0.5)d1=-d1;if(Math.abs(wNy)>0.5)d2=-d2;}
      else break;
    }
    return{segs,hit:hitResult};
  }

  function drawTrajectory(){
    if(!['AIMING','STRIKE'].includes(state)||!cueBall||cueBall.sunk)return;
    const t=calcTraj(aimDx,aimDy);
    t.segs.forEach((s,i)=>{
      ctx.save();ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);
      ctx.setLineDash([7,5]);ctx.lineWidth=1.6;
      ctx.strokeStyle=i===0?'rgba(255,255,255,0.55)':'rgba(255,255,255,0.2)';
      ctx.stroke();ctx.setLineDash([]);ctx.restore();
    });
    if(t.hit){
      const h=t.hit;
      // Ghost ball (where cue will be at impact)
      ctx.save();ctx.beginPath();ctx.arc(h.gx,h.gy,BR,0,Math.PI*2);
      ctx.strokeStyle='rgba(255,255,255,0.45)';ctx.lineWidth=1.5;ctx.setLineDash([3,3]);ctx.stroke();ctx.setLineDash([]);ctx.restore();
      // Target ball deflection (yellow arrow)
      ctx.save();
      const tLen=110,ax2=h.ball.x+h.tDx*tLen,ay2=h.ball.y+h.tDy*tLen,an=Math.atan2(h.tDy,h.tDx);
      ctx.beginPath();ctx.moveTo(h.ball.x,h.ball.y);ctx.lineTo(ax2,ay2);
      ctx.strokeStyle='rgba(255,210,0,0.78)';ctx.lineWidth=2.2;ctx.setLineDash([5,4]);ctx.stroke();ctx.setLineDash([]);
      ctx.beginPath();ctx.moveTo(ax2,ay2);ctx.lineTo(ax2-11*Math.cos(an-0.42),ay2-11*Math.sin(an-0.42));ctx.lineTo(ax2-11*Math.cos(an+0.42),ay2-11*Math.sin(an+0.42));
      ctx.closePath();ctx.fillStyle='rgba(255,210,0,0.78)';ctx.fill();ctx.restore();
      // Cue ball deflect (cyan)
      if(Math.abs(h.cDx)+Math.abs(h.cDy)>0.05){
        ctx.save();ctx.beginPath();ctx.moveTo(h.gx,h.gy);ctx.lineTo(h.gx+h.cDx*70,h.gy+h.cDy*70);
        ctx.strokeStyle='rgba(80,200,255,0.62)';ctx.lineWidth=1.8;ctx.setLineDash([5,4]);ctx.stroke();ctx.setLineDash([]);ctx.restore();
      }
    }
  }

  // — Cue stick —
  function getStickOffset(){
    if(state==='AIMING')return 14+shootPower*54;
    if(state==='AI_AIM')return 32+Math.sin((Date.now()-aiAimStart)*0.006)*8;
    if(state==='STRIKE'||state==='AI_STRIKE'){
      const t=Math.min((Date.now()-strikeStart)/110,1),ease=t*(2-t);
      return Math.max(1,30*(1-ease));
    }
    return 14;
  }
  function drawStick(){
    if(!['AIMING','STRIKE','AI_AIM','AI_STRIKE'].includes(state)||!cueBall||cueBall.sunk)return;
    // For AI_AIM, smoothly rotate stick toward target
    if(state==='AI_AIM'){
      const e=Math.min((Date.now()-aiAimStart)/700,1);
      const cur=Math.atan2(aimDy,aimDx),targ=Math.atan2(aiTargNy,aiTargNx);
      let diff=targ-cur;while(diff>Math.PI)diff-=Math.PI*2;while(diff<-Math.PI)diff+=Math.PI*2;
      const a=cur+diff*e;aimDx=Math.cos(a);aimDy=Math.sin(a);
    }
    const nx=aimDx,ny=aimDy,off=getStickOffset();
    const tipX=cueBall.x-nx*(BR+off),tipY=cueBall.y-ny*(BR+off);
    const butX=tipX-nx*STICK_LEN,butY=tipY-ny*STICK_LEN;
    ctx.save();
    ctx.beginPath();ctx.moveTo(tipX,tipY);ctx.lineTo(tipX-nx*18,tipY-ny*18);
    ctx.strokeStyle='#e0e0d8';ctx.lineWidth=2.8;ctx.lineCap='round';ctx.stroke();
    ctx.beginPath();ctx.moveTo(tipX-nx*18,tipY-ny*18);ctx.lineTo(tipX-nx*90,tipY-ny*90);
    const sg1=ctx.createLinearGradient(tipX-nx*18,tipY-ny*18,tipX-nx*90,tipY-ny*90);
    sg1.addColorStop(0,'#caa868');sg1.addColorStop(1,'#b89040');ctx.strokeStyle=sg1;ctx.lineWidth=3.5;ctx.stroke();
    ctx.beginPath();ctx.moveTo(tipX-nx*90,tipY-ny*90);ctx.lineTo(tipX-nx*170,tipY-ny*170);
    ctx.strokeStyle='#6a3010';ctx.lineWidth=5;ctx.stroke();
    ctx.beginPath();ctx.moveTo(tipX-nx*170,tipY-ny*170);ctx.lineTo(butX,butY);
    const sg2=ctx.createLinearGradient(tipX-nx*170,tipY-ny*170,butX,butY);
    sg2.addColorStop(0,'#4a2008');sg2.addColorStop(1,'#2a1004');ctx.strokeStyle=sg2;ctx.lineWidth=7;ctx.stroke();
    ctx.beginPath();ctx.arc(butX,butY,4,0,Math.PI*2);ctx.fillStyle='#1a0a02';ctx.fill();
    ctx.restore();
  }

  function drawHUD(){
    if(state==='AIMING'||state==='STRIKE'){
      ctx.fillStyle='rgba(255,255,255,0.12)';ctx.font='bold 10px sans-serif';ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText('YOUR SHOT',RAIL+5,RAIL+4);
    } else if(['AI_AIM','AI_STRIKE'].includes(state)||(state==='SHOOTING'&&!isPlayerTurn)){
      ctx.fillStyle='rgba(255,80,80,0.2)';ctx.font='bold 10px sans-serif';ctx.textAlign='right';ctx.textBaseline='top';ctx.fillText("CPU'S SHOT",W-RAIL-5,RAIL+4);
    }
    // Sunk balls in rail tray
    const pS=balls.filter(b=>b.sunk&&b.num>0&&b.num!==8&&pType&&isMyBall(b.num,pType));
    const aS=balls.filter(b=>b.sunk&&b.num>0&&b.num!==8&&hType&&isMyBall(b.num,hType));
    pS.forEach((b,i)=>{ctx.beginPath();ctx.arc(RAIL+10+i*16,H-11,5,0,Math.PI*2);ctx.fillStyle=BCOLOR[b.num];ctx.fill();});
    aS.forEach((b,i)=>{ctx.beginPath();ctx.arc(W-RAIL-10-i*16,H-11,5,0,Math.PI*2);ctx.fillStyle=BCOLOR[b.num];ctx.fill();});
  }

  function draw(){
    ctx.clearRect(0,0,W,H);drawTable();drawTrajectory();drawStick();
    balls.forEach(drawBall);drawSinkingBalls();drawBallInHand();drawHUD();
  }

  // — Physics —
  function physics(){
    let moving=false;
    balls.forEach(b=>{
      if(b.sunk)return;
      b.x+=b.vx;b.y+=b.vy;b.vx*=FRIC;b.vy*=FRIC;
      if(Math.abs(b.vx)<MIN_V)b.vx=0;if(Math.abs(b.vy)<MIN_V)b.vy=0;
      if(b.vx||b.vy)moving=true;
      const L=RAIL+BR,R=W-RAIL-BR,T=RAIL+BR,Bo=H-RAIL-BR;
      if(b.x<L){b.x=L;b.vx=Math.abs(b.vx)*0.84;moving=true;}
      if(b.x>R){b.x=R;b.vx=-Math.abs(b.vx)*0.84;moving=true;}
      if(b.y<T){b.y=T;b.vy=Math.abs(b.vy)*0.84;moving=true;}
      if(b.y>Bo){b.y=Bo;b.vy=-Math.abs(b.vy)*0.84;moving=true;}
    });
    let playedHitThisFrame=false;
    for(let iter=0;iter<3;iter++){
      for(let i=0;i<balls.length;i++){
        if(balls[i].sunk)continue;
        for(let j=i+1;j<balls.length;j++){
          if(balls[j].sunk)continue;
          const dx=balls[j].x-balls[i].x,dy=balls[j].y-balls[i].y,dist=Math.hypot(dx,dy);
          if(dist<BR*2&&dist>0){
            const nx2=dx/dist,ny2=dy/dist,ov=(BR*2-dist)/2;
            balls[i].x-=nx2*ov;balls[i].y-=ny2*ov;balls[j].x+=nx2*ov;balls[j].y+=ny2*ov;
            const relV=(balls[j].vx-balls[i].vx)*nx2+(balls[j].vy-balls[i].vy)*ny2;
            if(relV<0){
              balls[i].vx+=relV*nx2;balls[i].vy+=relV*ny2;balls[j].vx-=relV*nx2;balls[j].vy-=relV*ny2;
              moving=true;
              if(!playedHitThisFrame&&iter===0){playedHitThisFrame=true;playBallHit();}
            }
          }
        }
      }
    }
    balls.forEach(b=>{
      if(b.sunk)return;
      pockets.forEach(p=>{
        if(Math.hypot(b.x-p.x,b.y-p.y)<PCK_R){
          sinkingBalls.push({num:b.num,x:b.x,y:b.y,scale:1.2,alpha:1});
          b.sunk=true;b.vx=0;b.vy=0;sunkThisTurn.push(b.num);
          playPocket();
        }
      });
    });
    return moving;
  }

  // — Game logic —
  function handleTurnEnd(){
    const sunk=sunkThisTurn,e8=sunk.includes(8),eCue=sunk.includes(0);
    if(e8){
      if(isPlayerTurn){
        if(!assigned){endGame(false,'You sunk the 8-ball before your group was set! You lose.');return;}
        balls.filter(b=>!b.sunk&&isMyBall(b.num,pType)).length===0?endGame(true,'You sunk the 8-ball! 🎱 You WIN!'):endGame(false,'8-ball sunk early! You lose.');
      } else {
        if(!assigned){endGame(true,'CPU sunk 8-ball early! You win!');return;}
        balls.filter(b=>!b.sunk&&isMyBall(b.num,hType)).length===0?endGame(false,'CPU sunk the 8-ball. You lose.'):endGame(true,'CPU sunk 8-ball early! You win!');
      }
      return;
    }
    if(eCue){
      if(isPlayerTurn){
        // Player scratched — CPU gets ball-in-hand (CPU auto-places)
        cueBall.sunk=false;cueBall.x=W*0.22+Math.random()*40-20;cueBall.y=H/2+Math.random()*60-30;cueBall.vx=0;cueBall.vy=0;
        setStatus("You scratched! CPU's turn.");isPlayerTurn=false;sunkThisTurn=[];nextTurn();
      } else {
        // CPU scratched — player gets ball-in-hand
        cueBall.sunk=false;cueBall.vx=0;cueBall.vy=0;
        cueBall.x=-999;cueBall.y=-999; // hide until placed
        setStatus('CPU scratched! Ball in hand — click to place the cue ball.');
        setHint('Click anywhere on the green to place the cue ball');
        isPlayerTurn=true;sunkThisTurn=[];ballInHand=true;
        state='BALL_IN_HAND';if(!animId)animId=requestAnimationFrame(gameLoop);
      }
      return;
    }
    if(!assigned){
      const first=sunk.find(n=>n>0&&n!==8);
      if(first!=null){
        if(isPlayerTurn){pType=first<=7?'solid':'stripe';hType=pType==='solid'?'stripe':'solid';}
        else{hType=first<=7?'solid':'stripe';pType=hType==='solid'?'stripe':'solid';}
        assigned=true;updateTypePanels();
        setStatus(isPlayerTurn?`You have ${pType}s — keep shooting!`:`CPU has ${hType}s — you have ${pType}s!`);
      }
    }
    const validSunk=assigned?sunk.some(n=>isMyBall(n,isPlayerTurn?pType:hType)):sunk.some(n=>n>0&&n!==8);
    if(isPlayerTurn){
      if(validSunk)setStatus('Nice shot! Shoot again.');
      else{setStatus(sunk.length?'Wrong ball — CPU\'s turn.':'Missed — CPU\'s turn.');isPlayerTurn=false;}
    } else {
      if(validSunk)setStatus("CPU sinks one! CPU's turn again...");
      else{setStatus('CPU missed. Your turn!');isPlayerTurn=true;}
    }
    sunkThisTurn=[];nextTurn();
  }

  function nextTurn(){
    updateTypePanels();
    if(!isPlayerTurn){
      const shot=calcCpuShot();aiTargNx=shot.nx2;aiTargNy=shot.ny2;
      aiAimStart=Date.now();state='AI_AIM';
      setTimeout(()=>{
        if(state!=='AI_AIM')return;
        strikeStart=Date.now();state='AI_STRIKE';
        setTimeout(()=>{
          if(state!=='AI_STRIKE')return;
          const spreads={easy:0.35,medium:0.09,hard:0.018};
          const spread=(Math.random()-0.5)*spreads[getDiff()];
          const ang=Math.atan2(aiTargNy,aiTargNx)+spread,pwr=15+Math.random()*7;
          // Only cue ball gets velocity
          cueBall.vx=Math.cos(ang)*pwr;cueBall.vy=Math.sin(ang)*pwr;
          aimDx=Math.cos(ang);aimDy=Math.sin(ang);
          sunkThisTurn=[];state='SHOOTING';
          if(!animId)animId=requestAnimationFrame(gameLoop);
        },130);
      },1000);
      if(!animId)animId=requestAnimationFrame(gameLoop);
    } else {
      state='AIMING';setHint('Aim with mouse • Set power on bar • Click to shoot');
      if(!animId)animId=requestAnimationFrame(gameLoop);
    }
  }

  function calcCpuShot(){
    const diff=getDiff();
    let targets=balls.filter(b=>!b.sunk&&(assigned?isMyBall(b.num,hType):b.num>0&&b.num!==8));
    if(!targets.length)targets=balls.filter(b=>!b.sunk&&b.num===8);
    if(!targets.length)return{nx2:0,ny2:1};
    // Easy: 40% chance of picking a random (bad) target
    if(diff==='easy'&&Math.random()<0.4){
      const t=targets[Math.floor(Math.random()*targets.length)];
      const a=Math.atan2(t.y-cueBall.y,t.x-cueBall.x)+(Math.random()-0.5)*0.8;
      return{nx2:Math.cos(a),ny2:Math.sin(a)};
    }
    let best=null,bestScore=Infinity;
    targets.forEach(t=>{
      pockets.forEach(p=>{
        const dx2=t.x-p.x,dy2=t.y-p.y,tpL=Math.hypot(dx2,dy2);
        if(tpL<1)return;
        const gx=t.x+(dx2/tpL)*BR*2,gy=t.y+(dy2/tpL)*BR*2;
        const score=Math.hypot(cueBall.x-gx,cueBall.y-gy)+tpL*0.3;
        if(score<bestScore){bestScore=score;best={gx,gy};}
      });
    });
    if(!best)return{nx2:Math.random()*2-1,ny2:Math.random()*2-1};
    const dx2=best.gx-cueBall.x,dy2=best.gy-cueBall.y,len=Math.hypot(dx2,dy2);
    return len>0?{nx2:dx2/len,ny2:dy2/len}:{nx2:0,ny2:1};
  }

  // — Game loop —
  function gameLoop(){
    if(state==='SHOOTING'){
      const mv=physics();draw();
      if(!mv&&sinkingBalls.length===0){state='IDLE';handleTurnEnd();animId=null;return;}
    } else draw();
    // Keep loop alive during ball-in-hand so ghost ball follows cursor
    if(state==='BALL_IN_HAND'){animId=requestAnimationFrame(gameLoop);return;}
    animId=requestAnimationFrame(gameLoop);
  }

  // — Input —
  function evPos(e){
    const rect=canvas.getBoundingClientRect(),sx=W/rect.width,sy=H/rect.height;
    const t=e.touches?e.touches[0]:e;return{x:(t.clientX-rect.left)*sx,y:(t.clientY-rect.top)*sy};
  }
  function updDir(pos){const dx=pos.x-cueBall.x,dy=pos.y-cueBall.y,l=Math.hypot(dx,dy);if(l>4){aimDx=dx/l;aimDy=dy/l;}}
  function tryPlaceBall(pos){
    const inBounds=pos.x>RAIL+BR&&pos.x<W-RAIL-BR&&pos.y>RAIL+BR&&pos.y<H-RAIL-BR;
    const noOverlap=!balls.some(b=>!b.sunk&&b!==cueBall&&Math.hypot(b.x-pos.x,b.y-pos.y)<BR*2+1);
    if(inBounds&&noOverlap){
      cueBall.x=pos.x;cueBall.y=pos.y;cueBall.vx=0;cueBall.vy=0;
      ballInHand=false;state='AIMING';
      setStatus('Cue ball placed! Your shot.');
      setHint('Aim with mouse • Set power on bar • Click to shoot');
      if(!animId)animId=requestAnimationFrame(gameLoop);
    }
  }
  function onDown(e){
    const pos=evPos(e);
    if(state==='BALL_IN_HAND'){tryPlaceBall(pos);return;}
    if(state!=='AIMING')return;
    updDir(pos);
    const snx=aimDx,sny=aimDy,power=shootPower;
    playHit(0.3+power*0.7);
    strikeStart=Date.now();state='STRIKE';
    setTimeout(()=>{
      if(state!=='STRIKE')return;
      cueBall.vx=snx*(0.3+power*0.7)*22;
      cueBall.vy=sny*(0.3+power*0.7)*22;
      sunkThisTurn=[];state='SHOOTING';
      if(!animId)animId=requestAnimationFrame(gameLoop);
    },110);
  }
  function onMove(e){
    mousePos=evPos(e);
    if(state==='BALL_IN_HAND'){if(!animId)animId=requestAnimationFrame(gameLoop);return;}
    if(state!=='AIMING')return;
    updDir(mousePos);
  }
  function onUp(){}
  canvas.addEventListener('mousemove',onMove);
  canvas.addEventListener('mousedown',onDown);
  canvas.addEventListener('mouseup',onUp);
  canvas.addEventListener('mouseleave',()=>{mousePos=null;});
  canvas.addEventListener('touchstart',e=>{e.preventDefault();onDown(e);},{passive:false});
  canvas.addEventListener('touchmove',e=>{e.preventDefault();mousePos=evPos(e);if(state==='AIMING')updDir(mousePos);if(state==='BALL_IN_HAND'&&!animId)animId=requestAnimationFrame(gameLoop);},{passive:false});
  canvas.addEventListener('touchend',e=>{e.preventDefault();if(state==='BALL_IN_HAND'){tryPlaceBall(evPos(e));}else if(state==='AIMING'){onDown(e);}},{passive:false});

  // — Power bar —
  {
    const pwrBar=document.getElementById('pl-pwr-bar');
    const pwrFill=document.getElementById('pl-pwr-fill');
    const pwrKnob=document.getElementById('pl-pwr-knob');
    const pwrPct=document.getElementById('pl-pwr-pct');
    let draggingPwr=false;
    function updatePwrUI(){
      const p=shootPower*100;
      pwrFill.style.height=p+'%';
      pwrKnob.style.bottom='calc('+p+'% - 2px)';
      pwrPct.textContent=Math.round(p)+'%';
      pwrPct.style.color=shootPower>0.7?'#e74c3c':shootPower>0.4?'#f0d060':'#2ecc71';
    }
    function setPwrFromY(clientY){
      if(!pwrBar)return;
      const r=pwrBar.getBoundingClientRect();
      shootPower=Math.max(0,Math.min(1,1-(clientY-r.top)/r.height));
      updatePwrUI();
    }
    if(pwrBar){
      pwrBar.addEventListener('mousedown',e=>{draggingPwr=true;setPwrFromY(e.clientY);e.preventDefault();});
      document.addEventListener('mousemove',e=>{if(draggingPwr)setPwrFromY(e.clientY);});
      document.addEventListener('mouseup',()=>{draggingPwr=false;});
      pwrBar.addEventListener('touchstart',e=>{e.preventDefault();draggingPwr=true;setPwrFromY(e.touches[0].clientY);},{passive:false});
      pwrBar.addEventListener('touchmove',e=>{e.preventDefault();setPwrFromY(e.touches[0].clientY);},{passive:false});
      pwrBar.addEventListener('touchend',e=>{e.preventDefault();draggingPwr=false;},{passive:false});
      updatePwrUI();
    }
  }

  // — Controls —
  function startPool(){
    betAmt=Math.max(5,Math.min(500,parseInt(document.getElementById('pl-bet-in').value)||25));
    if(balance<betAmt){setStatus('Insufficient balance!');return;}
    balance-=betAmt;saveBalance();updateBalanceDisplay();
    document.getElementById('pl-bet-area').style.display='none';
    document.getElementById('pl-again-btn').style.display='none';
    document.getElementById('pl-result').innerHTML='';
    pType=null;hType=null;assigned=false;isPlayerTurn=true;sunkThisTurn=[];sinkingBalls=[];
    ballInHand=false;mousePos=null;
    rackBalls();aimDx=1;aimDy=0;
    updateTypePanels();setStatus('Set power on the right bar, aim with mouse, click to shoot!');
    setHint('Aim with mouse • Set power on bar • Click to shoot');
    state='AIMING';if(animId)cancelAnimationFrame(animId);animId=requestAnimationFrame(gameLoop);
  }
  function resetPool(){
    state='BET';sinkingBalls=[];ballInHand=false;mousePos=null;
    document.getElementById('pl-bet-area').style.display='flex';
    document.getElementById('pl-again-btn').style.display='none';
    document.getElementById('pl-result').innerHTML='';
    const pe=document.getElementById('pl-p-type'),ae=document.getElementById('pl-ai-type');
    pe.textContent='—';pe.style.color='#aaa';ae.textContent='—';ae.style.color='#aaa';
    setStatus("Place your bet and rack 'em!");setHint('');
    if(animId){cancelAnimationFrame(animId);animId=null;}
    rackBalls();draw();
  }
  function endGame(won,msg){
    state='OVER';if(animId){cancelAnimationFrame(animId);animId=null;}draw();
    if(won){balance+=betAmt*2;saveBalance();updateBalanceDisplay();document.getElementById('pl-result').innerHTML=`<div class="result-msg result-win">${msg} +$${betAmt}</div>`;}
    else document.getElementById('pl-result').innerHTML=`<div class="result-msg result-lose">${msg} -$${betAmt}</div>`;
    document.getElementById('pl-again-btn').style.display='inline-block';
  }

  rackBalls();draw();
}

// ===== INIT =====
renderLobby();
updateBalanceDisplay();

// Close modal on Escape
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeModal();
});

// Scroll modal overlay to top on open
const observer = new MutationObserver(()=>{
  const overlay = document.getElementById('modal-overlay');
  if(overlay.style.display==='block') overlay.scrollTop=0;
});
observer.observe(document.getElementById('modal-overlay'),{attributes:true,attributeFilter:['style']});
</script>
